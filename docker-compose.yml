version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dockflow-postgres
    restart: always
    environment:
      POSTGRES_USER: dockflow_user
      POSTGRES_PASSWORD: dockflow_pass
      POSTGRES_DB: dockflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockflow_user -d dockflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dockflow-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
